# Description: Auto compile
#
# 2026-08-19 改造：发布新版本自动编译产出
# - push 版本 tag（如 26.8.20）→ 自动编译 4 个目标（ipk/apk）→ 自动创建/更新该 tag 的 Release 挂产物
# - 在 GitHub 网页发布 Release → 自动触发编译 → 产物挂到该 Release
# - 保留手动 workflow_dispatch（可选填版本号，留空用 Makefile PKG_VERSION）
name: "Auto compile with openwrt sdk"
on:
  # 网页/API 发布 Release 时自动编译
  release:
    types: [published]
  # push 任意 tag 视为发版（如 26.8.20），自动编译并挂到该 tag 的 Release
  push:
    tags:
      - '*'
  # 手动触发（可选版本号）
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 26.8.20；留空则用 Makefile PKG_VERSION）'
        required: false
        default: ''
env:
  TZ: Asia/Shanghai
  passwall: ${{ github.repository }}
  packages: Openwrt-Passwall/openwrt-passwall-packages

permissions:
  contents: write
  actions: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      passwall_version: ${{ steps.check_version.outputs.latest_version }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check version
        id: check_version
        run: |
          # 确定发布版本号（三路触发统一在这里收敛）：
          # 1. release 事件：直接用触发的 tag（github.ref_name = tag 名）
          # 2. push tag 事件：github.ref_name = tag 名（如 26.8.20）
          # 3. workflow_dispatch：优先 inputs.version，留空读 Makefile PKG_VERSION-PKG_RELEASE
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "push" ]; then
            latest_version="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            latest_version="${{ github.event.inputs.version }}"
          else
            cd luci-app-passwall
            latest_version=$(awk -F ':=' '/^PKG_VERSION:=|^PKG_RELEASE:=/ {print $2}' Makefile | sed ':a;N;s/\$(PKG_VERSION)-//;s/\n$//;s/\n/-/;ba')
          fi
          echo "版本号: ${latest_version}"
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT

          # prerelease 判定：release 事件直接取对象的 prerelease 属性；
          # push tag / 手动触发：tag 含 rc/beta/alpha/pre 视为预发布
          if [ "${{ github.event_name }}" = "release" ]; then
            prerelease="${{ github.event.release.prerelease }}"
          else
            case "${latest_version}" in
              *rc*|*beta*|*alpha*|*pre*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi
          echo "prerelease=${prerelease}" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          echo "![](https://img.shields.io/github/downloads/${{ env.passwall }}/${{steps.check_version.outputs.latest_version}}/total?style=flat-square)" >> release.txt
          echo "## :mega: 获取其他软件包 / How to Get Other Packages" >>release.txt
          echo "" >>release.txt
          echo "### 方式 1：添加软件源 / Method 1: Add Software Source" >>release.txt
          echo " * 请按照 [openwrt-passwall-build](https://github.com/moetayuko/openwrt-passwall-build) 仓库的说明，将其提供的软件源添加到设备中，然后直接使用包管理器安装。" >>release.txt
          echo "  Follow the instructions in the [openwrt-passwall-build](https://github.com/moetayuko/openwrt-passwall-build) repository to add the provided software source to your device, then install directly using the package manager." >>release.txt
          echo "" >>release.txt
          echo "### 方式 2：手动下载并安装 / Method 2: Manual Download and Install" >>release.txt
          echo "" >>release.txt
          echo "* 从 [SourceForge](https://sourceforge.net/projects/openwrt-passwall-build/files/) 下载预构建的软件包。" >>release.txt
          echo "  Download prebuilt packages from [SourceForge](https://sourceforge.net/projects/openwrt-passwall-build/files/)." >>release.txt
          echo "" >>release.txt
          echo "* 将文件上传到您的设备，使用 Shell 命令进行安装。" >>release.txt
          echo "  Upload files to your device, install it with shell command." >>release.txt
          echo "" >>release.txt
          echo "ipk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "opkg install /path/to/package.ipk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "apk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "apk add /path/to/package.apk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "" >>release.txt
          echo ":warning: 请将 /path/to/package 替换为实际下载的软件包路径。" >>release.txt
          echo "- Replace /path/to/package with the actual path of the downloaded packages." >>release.txt
          touch release.txt

      # 2026-08-19 新增：把 release.txt 作为 artifact 传给 build job 作为 Release body
      - name: Upload release body artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release.txt
          if-no-files-found: error


  job_build_passwall:
    name: Build passwall [${{ matrix.ver }}]
    needs: job_check
    # 2026-08-19 改造：发布动作（release 事件 / push tag / 手动指定版本）必编译，
    # 不再做 has_update 远程版本对比（push 新 tag 即为发布，允许重复手动编译覆盖产物）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_tag: x86_64-21.02.7
            ver: "22.03-"

          - container_tag: x86_64-24.10.5
            ver: "23.05-24.10"

          - container_tag: x86-64-SNAPSHOT
            ver: "25.12+"

          # 2026-08-19: OpenWrt 25.12 正式版（apk 包格式）
          # 25.12 起 OpenWrt 全面切换到 apk 包管理器（OpenWrt 24.10 后 apk 可用，25.12 为默认）
          # SDK 镜像 tag 命名：x86_64-25.12-SNAPSHOT（见 docker.io/openwrt/sdk tags）
          # 产物为 .apk 格式，下方 find "luci-app-passwall*" 同时匹配 .ipk/.apk，无需额外处理
          - container_tag: x86_64-25.12-SNAPSHOT
            ver: "25.12-apk-"
    steps:
      - name: Checkout
        uses: actions/checkout@main

      # 2026-08-19 新增：下载 job_check 生成的 Release body（release.txt）
      - name: Download release body
        uses: actions/download-artifact@v4
        with:
          name: release-body
          path: release-body

      # 2026-08-21 新增：缓存 OpenWrt SDK 与 dl/ccache，加速二次编译
      - name: Cache OpenWrt SDK dl & ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            ~/.ccache
          key: openwrt-sdk-${{ matrix.container_tag }}-${{ hashFiles('luci-app-passwall/Makefile') }}
          restore-keys: |
            openwrt-sdk-${{ matrix.container_tag }}-

      - name: Generate .config for Language Packs
        run: |
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.container_tag }}
          PACKAGES: luci-app-passwall
          # V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p ${{ github.workspace }}/upload
          
          # 使用 find 安全提取生成的 ipk/apk 及语言包
          find bin/packages/ -type f -name "luci-app-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;
          find bin/packages/ -type f -name "luci-i18n-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;
          
          cd ${{ github.workspace }}/upload
          
          for i in $(ls); do mv $i ${{ matrix.ver }}_$i; done
          
          echo "status=success" >> $GITHUB_OUTPUT
      - name: Upload to release
        # 2026-08-19 改造：产物挂到发布版本下的 Release
        # - release 事件：挂到已发布的 Release（tag 存在，只追加文件）
        # - push tag / 手动：softprops 自动创建该 tag 的 Release
        # 注意：4 个矩阵 job 并行上传同一 Release，softprops v3 幂等追加文件；
        #       body 用 job_check 传来的 release.txt
        uses: softprops/action-gh-release@v3
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.passwall_version}}
          name: PassWall ${{needs.job_check.outputs.passwall_version}}
          body_path: release-body/release.txt
          prerelease: ${{needs.job_check.outputs.prerelease}}
          files: ${{ github.workspace }}/upload/*
